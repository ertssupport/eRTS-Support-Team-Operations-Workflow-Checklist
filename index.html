<title>eRoyal Tech Systems - Support Portal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:ital,wght@1,400;1,500&family=Sora:wght@500;600;700&display=swap">
<style>
:root{--navy:#071a3d;--royal:#0b4fb3;--cyan:#1fa7ff;--bg:#f3f7fc;--surface:#fff;--ink:#0c1a33;--muted:#5b6b85;--line:#dfe7f2;--amber:#e69b00;--shadow:0 1px 2px rgba(7,26,61,.06),0 10px 24px -14px rgba(7,26,61,.22);color-scheme:light}
[data-theme=dark]{--bg:#08111f;--surface:#0f1c31;--ink:#e8eef9;--muted:#93a3bd;--line:#1d2d48;--amber:#f5b83d;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px -14px rgba(0,0,0,.7);color-scheme:dark}
/* Category / link colours. Add a new one here and in CATEGORIES / LINK_TYPES below. */
.t-form,.k-form{--tone:#0b4fb3}.t-sheet,.k-sheet{--tone:#12805c}.t-doc,.k-doc{--tone:#6a4fd8}.t-chat,.k-chat{--tone:#1b9e4b}.t-performance,.k-video{--tone:#c27a00}.k-web{--tone:#0b7fa3}
[data-theme=dark] :is(.t-form,.k-form){--tone:#5aa5ff}[data-theme=dark] :is(.t-sheet,.k-sheet){--tone:#3ecf9a}[data-theme=dark] :is(.t-doc,.k-doc){--tone:#a493ff}[data-theme=dark] :is(.t-chat,.k-chat){--tone:#4ade80}[data-theme=dark] :is(.t-performance,.k-video){--tone:#f5b83d}[data-theme=dark] .k-web{--tone:#4cc9f0}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:16px}
body{font:400 15px/1.5 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:20px 16px 40px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto}
[hidden]{display:none!important}

.notice{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--amber) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--amber) 45%,transparent);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:500}
.notice span{flex:1}.notice button{background:none;border:0;color:var(--muted);padding:4px 8px}

.hero{position:relative;overflow:hidden;color:#fff;border-radius:24px;padding:28px 32px;display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:center;background:radial-gradient(90% 140% at 88% -30%,#1d8fe8 0,transparent 60%),linear-gradient(135deg,#061636 0%,#0a3a8c 100%)}
.hero>*{position:relative}
.wave{position:absolute!important;right:-30px;bottom:-20px;width:560px;max-width:70%;pointer-events:none}
.logo{width:136px;height:136px;border-radius:22px;background:#fff;box-shadow:0 14px 34px -12px rgba(0,0,0,.55)}
.logo img{width:100%;height:100%;object-fit:contain;border-radius:22px;display:block}
.hero h1{font:700 30px/1.15 Sora,sans-serif;letter-spacing:-.4px}
.hero .sub{color:#bcd6ff;font-weight:500;margin-top:4px}
.greet{font:italic 400 21px/1.3 Newsreader,Georgia,serif;margin-top:14px;color:#fff}
.greet small{font:500 13px Figtree,sans-serif;font-style:normal;color:#9ec4ff;margin-left:8px}
.stats{display:flex;gap:0;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:16px;backdrop-filter:blur(6px)}
.stat{padding:14px 22px;text-align:center}
.stat+.stat{border-left:1px solid rgba(255,255,255,.18)}
.stat b{display:block;font:700 28px/1 Sora,sans-serif}
.stat span{font-size:12.5px;color:#bcd6ff}

.bar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 14px}
.search{position:relative;flex:1 1 340px}
.search>i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--royal)}
[data-theme=dark] .search>i{color:var(--cyan)}
#q{width:100%;height:48px;padding:0 84px 0 44px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;outline:0;transition:border-color .2s,box-shadow .2s}
#q:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(31,167,255,.18)}
.search kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);font:600 12px Sora,sans-serif;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 8px}
#clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:0;background:var(--line);color:var(--muted)}
.ctl{height:48px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:0 14px;display:flex;align-items:center;gap:6px}
.ctl select{background:none;border:0;outline:0;font-weight:600;cursor:pointer}
.ctl select option{background:var(--surface)}
.seg{padding:4px}
.seg button,.iconbtn{width:40px;height:100%;border:0;background:none;border-radius:10px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--royal);color:#fff}
.iconbtn{width:48px;height:48px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px}
.iconbtn:hover{color:var(--amber)}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13.5px;color:var(--muted);transition:.15s}
.chip em{font:600 11.5px Sora,sans-serif;font-style:normal;background:var(--bg);border-radius:999px;padding:1px 8px}
.chip:hover{border-color:var(--royal);color:var(--ink)}
.chip[aria-pressed=true]{background:var(--royal);border-color:var(--royal);color:#fff}
.chip[aria-pressed=true] em{background:rgba(255,255,255,.2)}

.recent{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;color:var(--muted);font-size:13.5px}
.recent button{display:inline-flex;align-items:center;gap:7px;border:0;background:color-mix(in srgb,var(--royal) 9%,var(--surface));color:var(--ink);padding:6px 12px;border-radius:10px;font-weight:500}
.recent button:hover{background:color-mix(in srgb,var(--royal) 18%,var(--surface))}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:20px}
.grid.list{grid-template-columns:1fr;gap:10px}
.card{position:relative;overflow:hidden;display:grid;grid-template-columns:1fr auto;grid-template-areas:"ico pin" "body body" "links links";gap:14px 12px;align-content:start;padding:22px 20px 20px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);transition:transform .2s,border-color .2s}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--tone,var(--royal))}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--tone,var(--royal)) 45%,var(--line))}
.card.flash{animation:flash 1.4s}
@keyframes flash{30%{box-shadow:0 0 0 4px var(--cyan)}}
.ico{grid-area:ico;justify-self:start;width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:21px;color:var(--tone,var(--royal));background:color-mix(in srgb,var(--tone,var(--royal)) 12%,var(--surface))}
.pin{grid-area:pin;align-self:start;width:36px;height:36px;border:0;border-radius:10px;background:none;color:var(--muted);font-size:16px}
.pin:hover{background:var(--bg);color:var(--amber)}
.pin[aria-pressed=true]{color:var(--amber)}
.body{grid-area:body;min-width:0}
.meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:500}
.num{font:600 11.5px Sora,sans-serif;color:var(--tone,var(--royal));background:color-mix(in srgb,var(--tone,var(--royal)) 12%,var(--surface));padding:2px 9px;border-radius:999px}
.card h2{font:600 17.5px/1.3 Sora,sans-serif;margin:8px 0 6px;letter-spacing:-.2px}
.card p{color:var(--muted);font-size:14px;max-width:62ch}
.links{grid-area:links;display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.lnk{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:10px;font-weight:600;font-size:13.5px;text-decoration:none;color:var(--tone,var(--royal));background:color-mix(in srgb,var(--tone,var(--royal)) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--tone,var(--royal)) 28%,transparent);transition:background .15s,color .15s}
a.lnk:hover{background:var(--tone,var(--royal));color:var(--surface)}
.lnk.is-empty{background:none;color:var(--muted);border:1px dashed var(--line);cursor:not-allowed;font-weight:500}

.list .card{grid-template-columns:auto 1fr auto auto;grid-template-areas:"ico body links pin";align-items:center;padding:14px 16px 14px 20px;gap:16px}
.list .card::before{inset:0 auto 0 0;width:4px;height:auto}
.list .card:hover{transform:none}
.list .card h2{margin:4px 0 2px;font-size:16px}
.list .links{margin:0}.list .lnk{flex:none;min-width:92px}

.empty{text-align:center;padding:56px 16px;color:var(--muted)}
.empty i{font-size:34px;color:var(--cyan);margin-bottom:12px}
.empty h3{font:600 18px Sora,sans-serif;color:var(--ink);margin-bottom:6px}
.empty button{margin-top:14px;height:40px;padding:0 18px;border-radius:10px;border:0;background:var(--royal);color:#fff;font-weight:600}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:40px}

@media(max-width:900px){.hero{grid-template-columns:auto 1fr;padding:24px}.stats{grid-column:1/-1}.stat{flex:1}}
@media(max-width:700px){
 .list .card{grid-template-columns:auto 1fr auto;grid-template-areas:"ico body pin" "links links links"}
 .list .lnk{flex:1}
}
@media(max-width:560px){
 .hero{grid-template-columns:1fr;text-align:center;justify-items:center}.hero h1{font-size:25px}.logo{width:104px;height:104px}.stat{padding:12px 10px}.stat b{font-size:23px}
 .greet small{display:block;margin:4px 0 0}
 .search kbd{display:none}#q{padding-right:44px}
 .grid{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- admin ---- */
.hero .adminbtn{position:absolute!important;top:14px;right:16px;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);color:#fff;font:600 12.5px Figtree,sans-serif;backdrop-filter:blur(6px)}
.adminbtn:hover{background:rgba(255,255,255,.24)}
.adminbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;padding:12px 16px;border-radius:14px;background:color-mix(in srgb,var(--amber) 13%,var(--surface));border:1px dashed color-mix(in srgb,var(--amber) 60%,transparent)}
.adminbar b{font:600 14px Sora,sans-serif}
.adminbar .info{flex:1;color:var(--muted);font-size:13px;min-width:180px}
.btn{height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--royal)}
.btn.primary{background:var(--royal);border-color:var(--royal);color:#fff}
.btn.danger:hover{border-color:#d33;color:#d33}
.tools{grid-area:tools;display:flex;gap:6px;padding-top:12px;border-top:1px dashed var(--line)}
.tools button{width:36px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px}
.tools button:hover{color:var(--royal);border-color:var(--royal)}
.tools .danger{margin-left:auto}.tools .danger:hover{color:#d33;border-color:#d33}
.card.adm{grid-template-areas:"ico pin" "body body" "links links" "tools tools"}
.list .card.adm{grid-template-areas:"ico body links pin" "tools tools tools tools"}
.card.is-hidden{opacity:.6;border-style:dashed}
.badge{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--line);color:var(--muted)}
dialog{border:0;border-radius:20px;padding:0;width:min(560px,94vw);max-height:92vh;overflow:auto;background:var(--surface);color:var(--ink);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(6,20,45,.6);backdrop-filter:blur(3px)}
dialog form{padding:24px;display:grid;gap:14px}
dialog h3{font:600 20px Sora,sans-serif}
.f{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.f small{font-weight:400;font-size:12px}
.fld{width:100%;height:42px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);outline:0;font-weight:400}
textarea.fld{height:84px;padding:10px 12px;resize:vertical}
.fld:focus{border-color:var(--cyan)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.picks{display:flex;gap:6px 14px;flex-wrap:wrap}
.pick{display:inline-flex;align-items:center;gap:7px;font-weight:500;color:var(--ink);font-size:13.5px;cursor:pointer}
.lrow{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center}
.acts{display:flex;justify-content:flex-end;gap:10px;margin-top:4px}
.err{color:#d33;font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--navy);color:#fff;border:1px solid rgba(255,255,255,.15);padding:11px 18px;border-radius:12px;font-weight:500;font-size:14px;transition:.25s;pointer-events:none;z-index:50;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){.list .card.adm{grid-template-areas:"ico body pin" "links links links" "tools tools tools"}}
@media(max-width:480px){.row2{grid-template-columns:1fr}.lrow{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">

<div class="notice" id="notice" hidden><i class="fa-solid fa-bullhorn"></i><span id="noticeText"></span><button id="noticeClose" aria-label="Dismiss notice"><i class="fa-solid fa-xmark"></i></button></div>

<header class="hero">
  <svg class="wave" viewBox="0 0 560 200" aria-hidden="true"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#1fa7ff" stop-opacity="0"/><stop offset=".6" stop-color="#4cc3ff" stop-opacity=".55"/><stop offset="1" stop-color="#bfe9ff" stop-opacity=".7"/></linearGradient></defs><path d="M0 170C110 70 250 20 380 62c70 22 120 18 180-34v172H0Z" fill="url(#g)"/></svg>
  <button class="adminbtn" id="adminBtn" type="button"></button>
  <div class="logo"><img id="logo" alt="Royal Tech Systems logo"></div>
  <div>
    <h1 id="company"></h1>
    <p class="sub" id="title"></p>
    <p class="greet"><span id="greet"></span><small id="today"></small></p>
  </div>
  <div class="stats" aria-label="Portal summary">
    <div class="stat"><b id="sMods">0</b><span>Checklists</span></div>
    <div class="stat"><b id="sLinks">0</b><span>Links ready</span></div>
    <div class="stat"><b id="sPins">0</b><span>Pinned</span></div>
  </div>
</header>

<section class="adminbar" id="adminBar" hidden>
  <b><i class="fa-solid fa-user-shield"></i> Admin mode</b>
  <span class="info" id="adminInfo"></span>
  <button class="btn primary" id="addBtn" type="button"><i class="fa-solid fa-plus"></i> Add card</button>
  <button class="btn" id="bannerBtn" type="button"><i class="fa-solid fa-bullhorn"></i> Banner</button>
  <button class="btn" id="copyBtn" type="button"><i class="fa-regular fa-copy"></i> Copy code</button>
  <button class="btn danger" id="resetBtn" type="button"><i class="fa-solid fa-rotate-left"></i> Reset</button>
</section>

<section class="bar" aria-label="Search and view options">
  <div class="search">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input id="q" type="search" autocomplete="off" placeholder="Search checklists, e.g. Call status, Testing, #12" aria-label="Search checklists">
    <kbd id="kbd">/</kbd>
    <button id="clear" aria-label="Clear search" hidden><i class="fa-solid fa-xmark"></i></button>
  </div>
  <label class="ctl"><i class="fa-solid fa-arrow-down-wide-short" aria-hidden="true"></i>
    <select id="sort" aria-label="Sort checklists"><option value="order">Checklist order</option><option value="az">A to Z</option><option value="recent">Recently opened</option></select>
  </label>
  <div class="ctl seg" role="group" aria-label="Layout">
    <button data-view="grid" aria-label="Grid view" title="Grid view"><i class="fa-solid fa-table-cells-large"></i></button>
    <button data-view="list" aria-label="List view" title="List view"><i class="fa-solid fa-list"></i></button>
  </div>
  <button class="iconbtn" id="theme" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
</section>

<nav class="chips" id="chips" aria-label="Filter by type"></nav>
<div class="recent" id="recent" hidden></div>

<main class="grid" id="grid"></main>
<div class="empty" id="empty" hidden>
  <i class="fa-solid fa-folder-open"></i>
  <h3 id="emptyTitle">No matching checklist</h3>
  <p id="emptyText"></p>
  <button id="reset">Show all checklists</button>
</div>

<footer id="footer"></footer>
</div>

<dialog id="loginDlg"><form id="loginForm" autocomplete="off">
  <h3><i class="fa-solid fa-user-shield"></i> Admin login</h3>
  <label class="f">Username<input class="fld" id="lUser" required></label>
  <label class="f">Password<input class="fld" id="lPass" type="password" required></label>
  <p class="err" id="loginErr" hidden>Wrong username or password.</p>
  <div class="acts"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Login</button></div>
</form></dialog>

<dialog id="editDlg"><form id="editForm" autocomplete="off">
  <h3 id="editTitle">Edit card</h3>
  <label class="f">Title<input class="fld" id="fTitle" required></label>
  <label class="f">Description<textarea class="fld" id="fDesc"></textarea></label>
  <div class="row2">
    <label class="f">Tag<input class="fld" id="fTag" placeholder="Google Sheet"></label>
    <label class="f">Icon<input class="fld" id="fIcon" placeholder="headset"><small>Font Awesome name, e.g. bell, chart-line</small></label>
  </div>
  <div class="f">Show under filters<div class="picks" id="fCats"></div></div>
  <div class="row2">
    <label class="f">Card colour<select class="fld" id="fTone"></select></label>
    <label class="f">Position (number)<input class="fld" id="fPos" type="number" min="1"></label>
  </div>
  <div class="f">Buttons and links<div id="fLinks" style="display:grid;gap:8px"></div></div>
  <div class="acts"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Save</button></div>
</form></dialog>

<div class="toast" id="toast" role="status"></div>

const num = c => String(cards.indexOf(c) + 1).padStart(2, '0');
const pool = () => admin ? cards : cards.filter(c => !c.hidden);
const saveCards = () => { store.set('cards', cards); render(); };
let tt; function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 3500); }

function cardHTML(c) {
  const pinned = S.pins.has(c.id), tone = c.tone || c.cats[0];
  const links = Object.entries(c.links).map(([k, u]) => {
    const t = LINK_TYPES[k] || { label: k, icon: 'link' };
    const inner = `<i class="${ic(t.icon)}"></i>${esc(t.label)}`;
    return ready(u)
      ? `<a class="lnk k-${k}" href="${esc(u)}" target="_blank" rel="noopener noreferrer" aria-label="Open ${esc(t.label)} for ${esc(c.title)}">${inner}</a>`
      : `<span class="lnk is-empty k-${k}" title="Link not added yet">${inner}</span>`;
  }).join('');
  const tools = admin ? `<div class="tools">
    <button data-act="edit" title="Edit card and links"><i class="fa-solid fa-pen"></i></button>
    <button data-act="up" title="Move earlier"><i class="fa-solid fa-arrow-up"></i></button>
    <button data-act="down" title="Move later"><i class="fa-solid fa-arrow-down"></i></button>
    <button data-act="hide" title="${c.hidden ? 'Show to everyone' : 'Hide from everyone'}"><i class="fa-solid fa-eye${c.hidden ? '' : '-slash'}"></i></button>
    <button data-act="dup" title="Duplicate"><i class="fa-regular fa-copy"></i></button>
    <button data-act="del" class="danger" title="Delete"><i class="fa-solid fa-trash"></i></button></div>` : '';
  return `<article class="card t-${tone}${admin ? ' adm' : ''}${c.hidden ? ' is-hidden' : ''}" id="card-${c.id}" data-id="${c.id}">
    <span class="ico"><i class="${ic(c.icon)}"></i></span>
    <button class="pin" aria-pressed="${pinned}" aria-label="${pinned ? 'Unpin' : 'Pin'} ${esc(c.title)}" title="${pinned ? 'Unpin' : 'Pin to top'}"><i class="${pinned ? 'fa-solid' : 'fa-regular'} fa-star"></i></button>
    <div class="body"><div class="meta"><span class="num">#${num(c)}</span>${esc(c.tag)}${c.hidden ? '<span class="badge">Hidden</span>' : ''}</div><h2>${esc(c.title)}</h2><p>${esc(c.desc)}</p></div>
    <div class="links">${links}</div>${tools}</article>`;
}

function matches(c, filter, q) {
  const hay = `${c.title} ${c.desc} ${c.tag} ${num(c)}`.toLowerCase();
  const okF = filter === 'all' || (filter === 'pinned' ? S.pins.has(c.id) : c.cats.includes(filter));
  return okF && (!q || hay.includes(q));
}

function visible() {
  const q = S.q.trim().toLowerCase().replace(/^#/, '');
  const rank = c => { const i = S.recent.indexOf(c.id); return i < 0 ? 99 : i; };
  const pos = c => cards.indexOf(c);
  return pool().filter(c => matches(c, S.f, q)).sort((a, b) =>
    (S.pins.has(b.id) - S.pins.has(a.id)) ||
    (S.sort === 'az' ? a.title.localeCompare(b.title) : S.sort === 'recent' ? rank(a) - rank(b) || pos(a) - pos(b) : pos(a) - pos(b)));
}

function render() {
  const list = visible(), q = S.q.trim();
  $('#grid').className = 'grid' + (S.view === 'list' ? ' list' : '');
  $('#grid').innerHTML = list.map(cardHTML).join('');

  const empty = list.length === 0;
  $('#empty').hidden = !empty;
  if (empty) {
    $('#emptyTitle').textContent = q ? `Nothing found for "${q}"` : S.f === 'pinned' ? 'No pinned checklists yet' : 'No checklists here yet';
    $('#emptyText').textContent = S.f === 'pinned' && !q ? 'Tap the star on any card to keep it at the top.' : admin ? 'Use "Add card" to create one.' : 'Try a shorter word, or a number like #12.';
  }

  const filters = [['all', 'All'], ...Object.entries(CATEGORIES), ['pinned', 'Pinned']];
  $('#chips').innerHTML = filters.map(([k, label]) =>
    `<button class="chip" data-f="${k}" aria-pressed="${S.f === k}">${esc(label)}<em>${pool().filter(c => matches(c, k, '')).length}</em></button>`).join('');

  const rec = S.recent.map(id => pool().find(c => c.id === id)).filter(Boolean).slice(0, 4);
  const showRec = rec.length && !q && S.f === 'all';
  $('#recent').hidden = !showRec;
  if (showRec) $('#recent').innerHTML = 'Jump back in' + rec.map(c => `<button data-jump="${c.id}"><i class="${ic(c.icon)}"></i>${esc(c.title)}</button>`).join('');

  const all = pool().flatMap(c => Object.values(c.links));
  $('#sMods').textContent = pool().length;
  $('#sLinks').textContent = `${all.filter(ready).length}/${all.length}`;
  $('#sPins').textContent = pool().filter(c => S.pins.has(c.id)).length;
  $('#clear').hidden = !q; $('#kbd').hidden = !!q;
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === S.view));
  $('#sort').value = S.sort;

  $('#adminBar').hidden = !admin;
  $('#adminBtn').innerHTML = admin ? '<i class="fa-solid fa-right-from-bracket"></i> Logout' : '<i class="fa-solid fa-user-shield"></i> Admin';
  $('#adminInfo').textContent = `${cards.length} cards, ${cards.filter(c => c.hidden).length} hidden. Edits are saved in this browser only.`;
}

/* ---- card events ---- */
$('#grid').addEventListener('click', e => {
  const card = e.target.closest('.card'); if (!card) return;
  const id = +card.dataset.id;
  const act = e.target.closest('[data-act]');
  if (act) return adminAct(act.dataset.act, id);
  if (e.target.closest('.pin')) {
    S.pins.has(id) ? S.pins.delete(id) : S.pins.add(id);
    store.set('pins', [...S.pins]); return render();
  }
  if (e.target.closest('a.lnk')) {
    S.recent = [id, ...S.recent.filter(x => x !== id)].slice(0, 8);
    store.set('recent', S.recent); setTimeout(render, 0);
  }
});
$('#recent').addEventListener('click', e => {
  const b = e.target.closest('[data-jump]'); if (!b) return;
  const el = $('#card-' + b.dataset.jump); if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1500);
});

/* ---- admin actions ---- */
function adminAct(act, id) {
  const i = cards.findIndex(c => c.id === id), c = cards[i]; if (!c) return;
  if (act === 'edit') return openEdit(id);
  if (act === 'hide') { c.hidden = !c.hidden; toast(c.hidden ? 'Card hidden from everyone' : 'Card is visible again'); }
  if (act === 'up' && i > 0) [cards[i - 1], cards[i]] = [cards[i], cards[i - 1]];
  if (act === 'down' && i < cards.length - 1) [cards[i + 1], cards[i]] = [cards[i], cards[i + 1]];
  if (act === 'dup') { const d = JSON.parse(JSON.stringify(c)); d.id = Math.max(0, ...cards.map(x => x.id)) + 1; d.title += ' (copy)'; cards.splice(i + 1, 0, d); toast('Card duplicated'); }
  if (act === 'del') {
    if (!confirm(`Delete "${c.title}"? This cannot be undone.`)) return;
    cards.splice(i, 1); S.pins.delete(id); store.set('pins', [...S.pins]); toast('Card deleted');
  }
  saveCards();
}

function openEdit(id) {
  const isNew = id == null;
  const c = isNew ? { title: '', tag: '', desc: '', icon: 'folder', cats: [Object.keys(CATEGORIES)[0]], links: { form: '', sheet: '' } } : cards.find(x => x.id === id);
  editing = isNew ? null : c;
  $('#editTitle').textContent = isNew ? 'Add card' : 'Edit card';
  $('#fTitle').value = c.title; $('#fTag').value = c.tag; $('#fDesc').value = c.desc; $('#fIcon').value = c.icon;
  $('#fPos').value = isNew ? cards.length + 1 : cards.indexOf(c) + 1;
  $('#fCats').innerHTML = Object.entries(CATEGORIES).map(([k, l]) => `<label class="pick"><input type="checkbox" value="${k}" ${c.cats.includes(k) ? 'checked' : ''}>${esc(l)}</label>`).join('');
  $('#fTone').innerHTML = '<option value="">Auto</option>' + Object.entries(CATEGORIES).map(([k, l]) => `<option value="${k}" ${c.tone === k ? 'selected' : ''}>${esc(l)}</option>`).join('');
  $('#fLinks').innerHTML = Object.entries(LINK_TYPES).map(([k, t]) => `<div class="lrow" data-k="${k}"><label class="pick"><input type="checkbox" ${k in c.links ? 'checked' : ''}>${esc(t.label)}</label><input class="fld" inputmode="url" placeholder="https://..." value="${esc(c.links[k] || '')}"></div>`).join('');
  $('#editDlg').showModal();
}

$('#editForm').addEventListener('submit', e => {
  e.preventDefault();
  const links = {};
  if (editing) for (const k in editing.links) if (!(k in LINK_TYPES)) links[k] = editing.links[k];
  document.querySelectorAll('#fLinks .lrow').forEach(r => {
    if (!r.querySelector('[type=checkbox]').checked) return;
    let u = r.querySelector('.fld').value.trim();
    if (u && !/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;
    links[r.dataset.k] = u;
  });
  const cats = [...document.querySelectorAll('#fCats input:checked')].map(i => i.value);
  const wasEdit = !!editing;
  const c = editing || { id: Math.max(0, ...cards.map(x => x.id)) + 1 };
  Object.assign(c, { title: $('#fTitle').value.trim(), tag: $('#fTag').value.trim() || 'Checklist', desc: $('#fDesc').value.trim(), icon: $('#fIcon').value.trim() || 'folder', cats: cats.length ? cats : [Object.keys(CATEGORIES)[0]], links });
  const tone = $('#fTone').value; if (tone) c.tone = tone; else delete c.tone;
  if (wasEdit) cards.splice(cards.indexOf(c), 1);
  const at = Math.min(Math.max((parseInt($('#fPos').value) || cards.length + 1) - 1, 0), cards.length);
  cards.splice(at, 0, c);
  $('#editDlg').close(); saveCards(); toast(wasEdit ? 'Card updated' : 'Card added');
});

$('#addBtn').addEventListener('click', () => openEdit(null));
$('#resetBtn').addEventListener('click', () => {
  if (!confirm('Reset all cards to the original list in the file? Your admin edits in this browser will be lost.')) return;
  store.set('cards', null); cards = JSON.parse(JSON.stringify(DEFAULT_CARDS)); render(); toast('Reset to original cards');
});
$('#copyBtn').addEventListener('click', async () => {
  const code = `const DEFAULT_CARDS = ${JSON.stringify(cards, null, 2)};`;
  try { await navigator.clipboard.writeText(code); toast('Copied. Paste it over the DEFAULT_CARDS list in the HTML file to publish for everyone.'); }
  catch { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([code], { type: 'text/plain' })); a.download = 'cards-data.js'; a.click(); toast('Downloaded cards-data.js'); }
});
$('#bannerBtn').addEventListener('click', () => {
  const v = prompt('Banner message (leave empty to hide):', store.get('notice', PORTAL.notice));
  if (v !== null) { store.set('notice', v.trim()); store.set('dismissed', ''); applyNotice(); }
});

/* ---- admin login ---- */
$('#adminBtn').addEventListener('click', () => {
  if (admin) { admin = false; ses.set(false); render(); return toast('Logged out'); }
  $('#loginForm').reset(); $('#loginErr').hidden = true; $('#loginDlg').showModal(); $('#lUser').focus();
});
$('#loginForm').addEventListener('submit', e => {
  e.preventDefault();
  if ($('#lUser').value.trim() === ADMIN.user && $('#lPass').value === ADMIN.pass) {
    admin = true; ses.set(true); $('#loginDlg').close(); render(); toast('Admin mode is on');
  } else { $('#loginErr').hidden = false; $('#lPass').value = ''; $('#lPass').focus(); }
});
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => b.closest('dialog').close()));

/* ---- search, filters, sort, view ---- */
$('#chips').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (b) { S.f = b.dataset.f; render(); } });
$('#q').addEventListener('input', e => { S.q = e.target.value; render(); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Escape') clearSearch(); });
function clearSearch() { S.q = ''; $('#q').value = ''; render(); $('#q').focus(); }
$('#clear').addEventListener('click', clearSearch);
$('#reset').addEventListener('click', () => { S.q = ''; S.f = 'all'; $('#q').value = ''; render(); });
$('#sort').addEventListener('change', e => { S.sort = e.target.value; store.set('sort', S.sort); render(); });
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { S.view = b.dataset.view; store.set('view', S.view); render(); }));
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); }
});

/* ---- theme ---- */
function setTheme(t) {
  document.documentElement.dataset.theme = t; store.set('theme', t);
  $('#theme').innerHTML = `<i class="fa-solid fa-${t === 'dark' ? 'sun' : 'moon'}"></i>`;
}
$('#theme').addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
setTheme(store.get('theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

/* ---- header, banner, footer ---- */
document.title = PORTAL.company + ' - Support Portal';
$('#company').textContent = PORTAL.company;
$('#title').textContent = PORTAL.title;
const logo = $('#logo'); logo.src = PORTAL.logo; logo.onerror = () => { logo.onerror = null; logo.parentElement.hidden = true; };
const hr = new Date().getHours();
$('#greet').textContent = `${hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening'}, team. ${PORTAL.tagline}`;
$('#today').textContent = new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });
$('#footer').textContent = `© ${new Date().getFullYear()} ${PORTAL.company}. Internal Support Operations Portal.`;
function applyNotice() {
  const n = store.get('notice', PORTAL.notice);
  $('#noticeText').textContent = n; $('#notice').hidden = !(n && store.get('dismissed', '') !== n);
}
$('#noticeClose').addEventListener('click', () => { store.set('dismissed', store.get('notice', PORTAL.notice)); $('#notice').hidden = true; });
applyNotice();

render();
</script>
</body>
</html>
